<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Material Estimator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #f59e0b;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --input-border: #e2e8f0;
            --radius: 10px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background: var(--card);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        h2 {
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary);
            font-size: 1.5rem;
        }

        h3 {
            font-size: 1rem;
            margin: 20px 0 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 5px;
        }

        /* Responsive Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .full { grid-column: span 2; }

        /* Input Styles */
        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Button Styling */
        button {
            margin-top: 24px;
            padding: 14px;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        /* Results Section */
        .result {
            margin-top: 25px;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result p {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .result b {
            color: var(--primary);
        }

        /* Summary Box */
        .total-box {
            background: #1e293b;
            color: #ffffff;
            padding: 20px;
            border-radius: var(--radius);
            margin-top: 20px;
        }

        .total-box p {
            border-bottom: 1px solid #334155;
        }

        .total-box p:last-child { border: none; }

        .total-box b {
            color: var(--secondary);
            font-size: 1.1rem;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
            .full { grid-column: span 1; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Material Estimator</h2>

    <div class="grid">
        <div class="form-group full">
            <label>Wall Length (ft)</label>
            <input type="number" id="L" value="30">
        </div>

        <div class="form-group">
            <label>Height (ft)</label>
            <input type="number" id="H" value="9">
        </div>

        <div class="form-group">
            <label>Wall Thickness (inch)</label>
            <input type="number" id="T" value="5">
        </div>

        <div class="form-group full">
            <label>Door/Window Area (sq. ft)</label>
            <input type="number" id="openArea" value="0">
        </div>

        <div class="form-group">
            <label>Outside Plaster (inch)</label>
            <input type="number" id="pOut" value="0.75">
        </div>

        <div class="form-group">
            <label>Inside Plaster (inch)</label>
            <input type="number" id="pIn" value="0.5">
        </div>

        <div class="form-group">
            <label>Cement Ratio</label>
            <input type="number" id="rC" value="1">
        </div>

        <div class="form-group">
            <label>Sand Ratio</label>
            <input type="number" id="rS" value="4">
        </div>
    </div>

    <button onclick="calc()">Calculate Estimation</button>

    <div class="result" id="output">
        <h3>General Stats</h3>
        <p>Net Area: <b id="area"></b></p>
        <p>Total Volume: <b id="vol"></b></p>
        
        <h3>Component Breakdown</h3>
        <p>Bricks: <b id="brickCount"></b></p>
        <p>Brickwork Cement: <b id="bCement"></b></p>
        <p>Brickwork Sand: <b id="bSand"></b></p>
        <p>Plaster Cement: <b id="pCement"></b></p>
        <p>Plaster Sand: <b id="pSand"></b></p>

        <div class="total-box">
            <p>Total Bricks: <b id="totalBricks"></b></p>
            <p>Total Cement: <b id="tCement"></b></p>
            <p>Total Sand: <b id="tSand"></b></p>
        </div>
    </div>
</div>

<script>
    // Keep your existing calc() function logic here, it works perfectly.
    function getVal(id){ return parseFloat(document.getElementById(id).value) || 0; }
    function calc(){
        let L = getVal("L"), H = getVal("H"), T = getVal("T") / 12;
        let openArea = getVal("openArea"), pOut = getVal("pOut") / 12, pIn = getVal("pIn") / 12;
        let rC = getVal("rC"), rS = getVal("rS");

        let netArea = (L * H) - openArea;
        let brickVol = netArea * T;
        let singleBrick = (10 * 5 * 3) / 1728; // Standard brick size + mortar
        let bricks = Math.ceil(brickVol / singleBrick);

        let brickDry = brickVol * 0.30 * 1.33;
        let plasterVol = netArea * (pOut + pIn);
        let plasterDry = plasterVol * 1.33;

        let ratio = rC + rS;
        let bCementBag = ((brickDry * rC) / ratio) / 1.25;
        let bSand = (brickDry * rS) / ratio;
        let pCementBag = ((plasterDry * rC) / ratio) / 1.25;
        let pSand = (plasterDry * rS) / ratio;

        document.getElementById("area").innerText = netArea.toFixed(2) + " sft";
        document.getElementById("vol").innerText = brickVol.toFixed(2) + " cft";
        document.getElementById("brickCount").innerText = bricks.toLocaleString() + " pcs";
        document.getElementById("bCement").innerText = bCementBag.toFixed(2) + " bags";
        document.getElementById("bSand").innerText = bSand.toFixed(2) + " cft";
        document.getElementById("pCement").innerText = pCementBag.toFixed(2) + " bags";
        document.getElementById("pSand").innerText = pSand.toFixed(2) + " cft";

        document.getElementById("totalBricks").innerText = bricks.toLocaleString() + " pcs";
        document.getElementById("tCement").innerText = (bCementBag + pCementBag).toFixed(2) + " bags";
        document.getElementById("tSand").innerText = (bSand + pSand).toFixed(2) + " cft";

        document.getElementById("output").style.display = "block";
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
